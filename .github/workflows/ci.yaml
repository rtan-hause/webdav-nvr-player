name: ci

# App CI: Go/web lint + tests and a Docker build. Skipped when a change only
# touches the Helm chart (chart-ci.yaml covers that), docs, or release-please
# bookkeeping, which also keeps release PRs from running the full suite.
on:
  pull_request:
    paths-ignore:
      - charts/**
      - docs/**
      - "**.md"
      - LICENSE
      - renovate.json
      - release-please-config*.json
      - .release-please-manifest*.json
      - .github/workflows/chart-ci.yaml
      - .github/workflows/chart-release.yaml
      - .github/workflows/release.yaml
  push:
    branches: [main]
    paths-ignore:
      - charts/**
      - docs/**
      - "**.md"
      - LICENSE
      - renovate.json
      - release-please-config*.json
      - .release-please-manifest*.json
      - .github/workflows/chart-ci.yaml
      - .github/workflows/chart-release.yaml
      - .github/workflows/release.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: self-hosted-hause
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      NVR_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      # The ARC runner image is minimal: make for the Makefile, gcc for
      # go test -race (cgo), xz to unpack ffmpeg.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev xz-utils
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ffmpeg 8.1
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=linux64 ;;
            ARM64) arch=linuxarm64 ;;
            *) echo "unsupported runner arch $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/ffmpeg" && mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-$arch-gpl-8.1.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1
      - run: make lint
      # The docker job builds the frontend and binary, so no `make web build` here.
      - run: make test

  docker:
    runs-on: self-hosted-hause
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
