name: chart-ci

# Helm chart lint/render. Only runs when the chart changes; app CI is in ci.yaml.
on:
  pull_request:
    paths:
      - charts/**
      - .github/workflows/chart-ci.yaml
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/chart-ci.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: self-hosted-hause
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint and render the Helm chart
        run: |
          for f in charts/webdav-nvr-player/ci/*.yaml; do
            helm lint charts/webdav-nvr-player -f "$f"
            helm template ci charts/webdav-nvr-player -f "$f" > /dev/null
          done
